<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -130 880 790" width="880" height="790" role="img" aria-labelledby="org-title org-desc" class="dg">
<title id="org-title">Cross-module system shape: how Theorem Derivation sits below the Project Workspace and beside the other Derivation Engine modules</title>
<desc id="org-desc">A static rendering of the canonical Mermaid source in docs/assets/theorem-organization.mmd. Solid arrows are implemented paths: the Project Workspace feeds Notation V2 and the Hypothesis Work Unit; the Hypothesis Work Unit feeds the C attempt ledger; the C attempt ledger feeds the verifier plane; the verifier plane feeds the commit automaton; A records and the B theorem graph feed the commit automaton and the commit automaton advances them in return; A records and the B theorem graph, the C attempt ledger, and the Hypothesis Work Unit all feed the Obsidian read-only views; and the Hypothesis Work Unit feeds live WezTerm and Herdr interaction. Dashed arrows are current human procedures or missing adapters: case attachment from the Project Workspace into A records and the B theorem graph is not implemented; Notation V2 reaches the Hypothesis Work Unit only as a manual reference today; the Notation V1 registry adapter into A records and the B theorem graph is not implemented; and the Loading Dock export from the commit automaton back into Notation V1 is not implemented.</desc>
<style>
:root {
  --page: #ffffff;
  --surface: #f6f7f9;
  --border: #dfe3e9;
  --border-strong: #c6ccd6;
  --text: #14171c;
  --text-muted: #565f6d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0f1216;
    --surface: #161a20;
    --border: #262c35;
    --border-strong: #39414d;
    --text: #e7eaef;
    --text-muted: #9aa4b2;
  }
}
.dg {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.dg-canvas { fill: var(--page); }
.dg-box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.2; }
.dg-name { font-size: 13px; font-weight: 600; fill: var(--text); }
.dg-sub { font-size: 12px; fill: var(--text-muted); }
.dg-edge { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
.dg-edge--pending { stroke-dasharray: 7 4; }
.dg-edge-label { font-size: 11px; fill: var(--text-muted); }
.dg-arrowhead { fill: var(--text-muted); }
</style>
<defs>
<marker id="dg-arrow-org" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
