<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" role="img" aria-labelledby="auth-title auth-desc" class="dg">
<title id="auth-title">Internal authority boundary: committed theorem state, dynamic proposal and verification, and the read-only projection</title>
<desc id="auth-desc">A static rendering of the canonical Mermaid source in docs/assets/theorem-authority-boundary.mmd. The committed theorem state group holds A formal records, which supply typed records to the B theorem graph. The dynamic proposal and verification group holds a chain: WezTerm plus Herdr carries live dialogue to a Hypothesis proposal, which appends to the C attempt ledger, which sends a scoped query to the verifier plane, which returns a certificate or witness to the commit automaton. The commit automaton advances the B theorem graph only, and writes the preserved outcome back to the C attempt ledger. The B theorem graph and the C attempt ledger both feed Obsidian views as read-only projections. A dashed arrow shows human review reaching the C attempt ledger for governance only.</desc>
<style>
:root {
  --page: #ffffff;
  --surface: #f6f7f9;
  --border: #dfe3e9;
  --border-strong: #c6ccd6;
  --text: #14171c;
  --text-muted: #565f6d;
  --accent-soft: #e7eff7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0f1216;
    --surface: #161a20;
    --border: #262c35;
    --border-strong: #39414d;
    --text: #e7eaef;
    --text-muted: #9aa4b2;
    --accent-soft: #1b2937;
  }
}
.dg {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.dg-canvas { fill: var(--page); }
.dg-box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.2; }
.dg-cluster { fill: var(--accent-soft); stroke: var(--border); stroke-width: 1.2; }
.dg-cluster-label { font-size: 12px; font-weight: 600; fill: var(--text-muted); }
.dg-name { font-size: 13px; font-weight: 600; fill: var(--text); }
.dg-edge { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
.dg-edge--pending { stroke-dasharray: 7 4; }
.dg-edge-label { font-size: 11px; fill: var(--text-muted); }
.dg-arrowhead { fill: var(--text-muted); }
</style>
<defs>
<marker id="dg-arrow-auth" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path class="dg-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<rect class="dg-canvas" x="0" y="0" width="880" height="610"/>

<g class="dg-clusters">
<rect class="dg-cluster" x="30" y="40" width="250" height="524" rx="8"/>
<text class="dg-cluster-label" x="44" y="62">Dynamic proposal and verification</text>
<rect class="dg-cluster" x="340" y="40" width="250" height="200" rx="8"/>
<text class="dg-cluster-label" x="354" y="62">Committed theorem state</text>
</g>

<g class="dg-nodes">
<rect class="dg-box" x="60" y="80" width="190" height="44" rx="6"/>
<text class="dg-name" x="155" y="107" text-anchor="middle">WezTerm + Herdr</text>

<rect class="dg-box" x="60" y="180" width="190" height="44" rx="6"/>
<text class="dg-name" x="155" y="207" text-anchor="middle">Hypothesis proposal</text>

<rect class="dg-box" x="60" y="280" width="190" height="44" rx="6"/>
<text class="dg-name" x="155" y="307" text-anchor="middle">C: attempt ledger</text>

<rect class="dg-box" x="60" y="380" width="190" height="44" rx="6"/>
<text class="dg-name" x="155" y="407" text-anchor="middle">Verifier plane</text>

<rect class="dg-box" x="60" y="480" width="190" height="44" rx="6"/>
<text class="dg-name" x="155" y="507" text-anchor="middle">Commit automaton</text>

<rect class="dg-box" x="370" y="80" width="190" height="44" rx="6"/>
<text class="dg-name" x="465" y="107" text-anchor="middle">A: formal records</text>

<rect class="dg-box" x="370" y="180" width="190" height="44" rx="6"/>
<text class="dg-name" x="465" y="207" text-anchor="middle">B: theorem graph</text>

<rect class="dg-box" x="650" y="300" width="190" height="44" rx="6"/>
<text class="dg-name" x="745" y="327" text-anchor="middle">Obsidian views</text>

<rect class="dg-box" x="340" y="480" width="190" height="44" rx="6"/>
<text class="dg-name" x="435" y="507" text-anchor="middle">Human review</text>
</g>

<g class="dg-edges">
<path class="dg-edge" d="M 465 124 V 180" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="475" y="156">typed records</text>

<path class="dg-edge" d="M 155 124 V 180" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="165" y="156">live dialogue</text>

<path class="dg-edge" d="M 155 224 V 280" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="165" y="256">append</text>

<path class="dg-edge" d="M 155 324 V 380" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="165" y="356">scoped query</text>

<path class="dg-edge" d="M 155 424 V 480" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="165" y="456">certificate or witness</text>

<path class="dg-edge" d="M 250 496 H 320 V 202 H 370" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="328" y="270">advance only</text>

<path class="dg-edge" d="M 60 502 H 45 V 302 H 60" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="66" y="356">preserved outcome</text>

<path class="dg-edge" d="M 560 202 H 745 V 300" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="738" y="260" text-anchor="end">read-only projection</text>

<path class="dg-edge" d="M 250 312 H 620 V 322 H 650" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="420" y="304" text-anchor="middle">read-only projection</text>

<path class="dg-edge dg-edge--pending" d="M 340 502 H 296 V 302 H 250" marker-end="url(#dg-arrow-auth)"/>
<text class="dg-edge-label" x="334" y="522" text-anchor="end">governance only</text>
</g>
</svg>
