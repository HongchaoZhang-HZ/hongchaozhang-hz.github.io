<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 334" width="860" height="334" role="img" aria-labelledby="ug-zh-title ug-zh-desc" class="dg">
<title id="ug-zh-title">Selected Manager 交互架构：用户在所选的一个 Manager（Codex 或 Claude）中工作，由它管理 Project Workspace 并调度 Obsidian 与 Herdr 两个工作视窗</title>
<desc id="ug-zh-desc">这是 docs/assets/user-guide-interaction-zh.mmd 中标准 Mermaid 源文本的静态渲染。用户通过 Selected Manager 工作；它是 Codex 或 Claude，并且是该 Project 唯一的 Active Manager。Selected Manager 通向三个目标：Project Workspace、承载复杂内容与持久审阅的 Obsidian，以及作为核心工作视窗的 WezTerm 与 Herdr。Herdr 把实时工作结果写回 Project Workspace，Project Workspace 再投影到 Obsidian。两个 Manager 共享同一个 Project Workspace，所以图中只画一个 Manager 方块，而不是两个。图中每个箭头都是人或 Active Manager 经过的路线，而不是受检查的机器 attachment。</desc>
<style>
:root {
  --page: #ffffff;
  --surface: #f6f7f9;
  --border: #dfe3e9;
  --border-strong: #c6ccd6;
  --text: #14171c;
  --text-muted: #565f6d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0f1216;
    --surface: #161a20;
    --border: #262c35;
    --border-strong: #39414d;
    --text: #e7eaef;
    --text-muted: #9aa4b2;
  }
}
.dg {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.dg-canvas { fill: var(--page); }
.dg-box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.2; }
.dg-name { font-size: 13px; font-weight: 600; fill: var(--text); }
.dg-sub { font-size: 12px; fill: var(--text-muted); }
.dg-edge { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
.dg-edge--pending { stroke-dasharray: 7 4; }
.dg-edge-label { font-size: 11px; fill: var(--text-muted); }
.dg-arrowhead { fill: var(--text-muted); }
</style>
<defs>
<marker id="dg-arrow-ug-zh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path class="dg-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>
<rect class="dg-canvas" x="0" y="0" width="860" height="334"/>

<g class="dg-nodes">
<rect class="dg-box" x="20" y="140" width="140" height="54" rx="6"/>
<text class="dg-name" x="90" y="172" text-anchor="middle">用户</text>

<rect class="dg-box" x="200" y="140" width="280" height="54" rx="6"/>
<text class="dg-name" x="340" y="163" text-anchor="middle">Selected Manager</text>
<text class="dg-sub" x="340" y="180" text-anchor="middle">Codex 或 Claude</text>

<rect class="dg-box" x="520" y="20" width="300" height="54" rx="6"/>
<text class="dg-name" x="670" y="43" text-anchor="middle">Obsidian</text>
<text class="dg-sub" x="670" y="60" text-anchor="middle">复杂内容与持久审阅</text>

<rect class="dg-box" x="520" y="140" width="300" height="54" rx="6"/>
<text class="dg-name" x="670" y="172" text-anchor="middle">Project Workspace</text>

<rect class="dg-box" x="520" y="260" width="300" height="54" rx="6"/>
<text class="dg-name" x="670" y="283" text-anchor="middle">WezTerm 与 Herdr</text>
<text class="dg-sub" x="670" y="300" text-anchor="middle">核心工作视窗</text>
</g>

<g class="dg-edges">
<path class="dg-edge" d="M 160 167 H 200" marker-end="url(#dg-arrow-ug-zh)"/>
<path class="dg-edge" d="M 480 167 H 520" marker-end="url(#dg-arrow-ug-zh)"/>
<path class="dg-edge" d="M 480 152 H 500 V 47 H 520" marker-end="url(#dg-arrow-ug-zh)"/>
<path class="dg-edge" d="M 480 182 H 500 V 287 H 520" marker-end="url(#dg-arrow-ug-zh)"/>
<path class="dg-edge" d="M 600 260 V 194" marker-end="url(#dg-arrow-ug-zh)"/>
<path class="dg-edge" d="M 740 140 V 74" marker-end="url(#dg-arrow-ug-zh)"/>
</g>
</svg>
